<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>规约棱镜 · BER/CER/DER 检查台</title>
<style>
  :root { --bg:#0f1420; --panel:#171e2e; --line:#2a3550; --fg:#dbe4f5; --dim:#8b98b8;
          --err:#ff6b6b; --ok:#51cf8a; --warn:#ffd43b; --acc:#6ea8fe; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 "SF Mono", Menlo, Consolas, monospace; background:var(--bg); color:var(--fg); }
  header { padding:16px 24px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:12px; }
  header h1 { font-size:20px; margin:0; color:var(--acc); letter-spacing:2px; }
  header span { color:var(--dim); font-size:12px; }
  main { display:grid; grid-template-columns: 380px 1fr; gap:16px; padding:16px 24px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; }
  .panel h2 { font-size:13px; margin:0 0 10px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; }
  textarea { width:100%; min-height:110px; background:#0b0f1a; color:var(--fg); border:1px solid var(--line);
             border-radius:6px; padding:8px; font:inherit; resize:vertical; }
  select, input[type=text] { width:100%; background:#0b0f1a; color:var(--fg); border:1px solid var(--line);
             border-radius:6px; padding:6px; font:inherit; margin-bottom:8px; }
  .modes { display:flex; gap:10px; margin:8px 0; }
  .modes label { display:flex; gap:4px; align-items:center; color:var(--dim); cursor:pointer; }
  button { background:var(--acc); color:#0b0f1a; border:0; border-radius:6px; padding:8px 18px;
           font:inherit; font-weight:700; cursor:pointer; }
  button:hover { filter:brightness(1.15); }
  table { border-collapse:collapse; width:100%; font-size:12.5px; }
  th, td { text-align:left; padding:4px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:600; position:sticky; top:0; background:var(--panel); }
  tr.bad td { color:var(--err); }
  tr:hover td { background:#1d2740; }
  .tag { color:var(--acc); }
  .decoded { color:var(--ok); }
  .err { color:var(--err); font-size:12px; }
  .finding { padding:6px 8px; border-left:3px solid var(--err); margin:4px 0; background:#1a1320; }
  .finding.warn { border-color:var(--warn); }
  .change { padding:6px 8px; border-left:3px solid var(--acc); margin:4px 0; background:#101a2e; }
  .hexout { word-break:break-all; background:#0b0f1a; border:1px solid var(--line); border-radius:6px;
            padding:8px; max-height:120px; overflow:auto; color:var(--ok); }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11px; margin-left:8px; }
  .badge.ok { background:#12341f; color:var(--ok); }
  .badge.no { background:#3a1a1a; color:var(--err); }
  .hist div { padding:4px 6px; border-bottom:1px solid var(--line); cursor:pointer; }
  .hist div:hover { background:#1d2740; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .scroll { max-height:70vh; overflow:auto; }
  .muted { color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>规约棱镜</h1>
  <span>BER / CER / DER 本地检查台 — 所有解析与规范化均在本机完成</span>
</header>
<main>
  <div>
    <div class="panel">
      <h2>输入</h2>
      <select id="fixture"><option value="">— 选择内置样例 —</option></select>
      <div class="muted" id="fixtureDesc"></div>
      <textarea id="hex" placeholder="粘贴十六进制字节，如 3080308002010500000000"></textarea>
      <input type="text" id="name" placeholder="备注名（可选）">
      <div class="modes">
        <label><input type="radio" name="mode" value="BER" checked> BER 宽松读取</label>
        <label><input type="radio" name="mode" value="CER"> CER 检查</label>
        <label><input type="radio" name="mode" value="DER"> DER 检查</label>
      </div>
      <button id="go">解析</button>
      <span id="status"></span>
    </div>
    <div class="panel" style="margin-top:16px">
      <h2>历史导入（SQLite）</h2>
      <div class="hist" id="history"><div class="muted">暂无</div></div>
    </div>
  </div>
  <div>
    <div class="panel">
      <h2>范围树 <span id="matchBadge"></span></h2>
      <div class="scroll">
      <table id="tree">
        <thead><tr>
          <th>偏移</th><th>Tag</th><th>类</th><th>构造</th><th>长度字段</th>
          <th>内容范围</th><th>解码值 / 错误</th>
        </tr></thead>
        <tbody></tbody>
      </table>
      </div>
    </div>
    <div class="cols" style="margin-top:16px">
      <div class="panel"><h2>违规发现</h2><div id="findings" class="scroll"></div></div>
      <div class="panel"><h2>规范化变更原因</h2><div id="changes" class="scroll"></div></div>
    </div>
    <div class="panel" style="margin-top:16px">
      <h2>规范化输出（canonical hex）</h2>
      <div class="hexout" id="canonical"></div>
    </div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);

async function loadFixtures() {
  const list = await (await fetch('/api/fixtures')).json();
  for (const f of list) {
    const o = document.createElement('option');
    o.value = f.id; o.textContent = f.title;
    o.dataset.hex = f.hex; o.dataset.desc = f.description;
    $('fixture').appendChild(o);
  }
}
$('fixture').addEventListener('change', e => {
  const o = e.target.selectedOptions[0];
  if (o && o.dataset.hex) { $('hex').value = o.dataset.hex; $('fixtureDesc').textContent = o.dataset.desc; }
});

function mode() { return document.querySelector('input[name=mode]:checked').value; }

async function parse() {
  $('status').textContent = '解析中…';
  const body = new URLSearchParams({ hex: $('hex').value, mode: mode(), name: $('name').value });
  const r = await fetch('/api/parse', { method: 'POST', body });
  const j = await r.json();
  $('status').textContent = '';
  if (j.error) { $('status').textContent = j.error; return; }
  render(j);
  loadHistory();
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function render(j) {
  const tb = document.querySelector('#tree tbody');
  tb.innerHTML = '';
  const walk = (n) => {
    const tr = document.createElement('tr');
    if (n.errors.length) tr.className = 'bad';
    const indent = '&nbsp;'.repeat(n.depth * 4);
    tr.innerHTML =
      `<td>${n.offset}</td>` +
      `<td class="tag">${indent}${esc(n.tagHex)} ${esc(n.tagName)}${n.tagNumber > 30 ? ' (长tag)' : ''}</td>` +
      `<td>${esc(n.tagClass)}</td>` +
      `<td>${n.constructed ? 'C' : 'P'}</td>` +
      `<td>${esc(n.lengthHex)} <span class="muted">${esc(n.lengthDesc)}</span></td>` +
      `<td>[${n.contentStart}, ${n.contentEnd})</td>` +
      `<td>${n.decoded ? `<span class="decoded">${esc(n.decoded)}</span>` : ''}` +
      `${n.errors.map(e => `<div class="err">⚠ ${esc(e)}</div>`).join('')}</td>`;
    tb.appendChild(tr);
    n.children.forEach(walk);
  };
  j.tree.forEach(walk);

  $('findings').innerHTML = j.findings.length
    ? j.findings.map(f => `<div class="finding">[${esc(f.level)}] 节点#${f.nodeId} (${esc(f.path)}): ${esc(f.message)}</div>`).join('')
    : '<div class="muted">无违规</div>';
  $('changes').innerHTML = j.changes.length
    ? j.changes.map(c => `<div class="change">节点#${c.nodeId} (${esc(c.path)}): ${esc(c.reason)}</div>`).join('')
    : '<div class="muted">无需变更</div>';
  $('canonical').textContent = j.canonicalHex;
  $('matchBadge').innerHTML = j.matchesInput
    ? '<span class="badge ok">输入已符合规范</span>'
    : '<span class="badge no">输入与规范化输出不同</span>';
}

async function loadHistory() {
  const list = await (await fetch('/api/history')).json();
  $('history').innerHTML = list.length ? '' : '<div class="muted">暂无</div>';
  for (const r of list) {
    const d = document.createElement('div');
    d.textContent = `#${r.id} [${r.mode}] ${r.name || '(未命名)'} ${r.inputLength}B @ ${r.createdAt}`;
    d.onclick = async () => render(await (await fetch('/api/imports/' + r.id)).json());
    $('history').appendChild(d);
  }
}

$('go').addEventListener('click', parse);
loadFixtures(); loadHistory();
</script>
</body>
</html>
